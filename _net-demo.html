<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Duckdoku — goal net demo</title>
<style>
  :root{--bg:#2f8745;}
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,system-ui,sans-serif;color:#fff;
    background:radial-gradient(135% 100% at 50% 6%,#3a9a52 0%,#2f8745 48%,#256d39 100%);
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 14px 40px;}
  h1{font-size:18px;font-weight:900;margin:2px 0 2px;}
  .sub{font-size:13px;opacity:.85;margin:0 0 18px;text-align:center;max-width:520px;}
  .row{display:flex;gap:26px;flex-wrap:wrap;justify-content:center;align-items:flex-start;}
  .card{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .tag{font-size:12px;font-weight:900;letter-spacing:1.5px;opacity:.9;}
  .tag.after{color:#FFE48A;}
  /* the goal stage */
  .goal{position:relative;width:300px;max-width:80vw;}
  .goalsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));}
  .gnet{transform-origin:50% 0;}
  /* BEFORE: the current uniform stretch */
  .before.scored .gnet{animation:netbulge .55s ease;}
  @keyframes netbulge{0%{transform:scaleY(1)}28%{transform:scaleY(1.16) translateY(3px)}100%{transform:scaleY(1)}}
  /* AFTER: a localized pocket that punches in where the ball hits, then springs back with a damped wobble */
  .after.scored .gnet{animation:netcatch .8s cubic-bezier(.33,.06,.28,1);}
  @keyframes netcatch{
    0%  {d:path('M36 32 H204 V104 C150 104 90 104 36 104 Z');transform:scaleX(1);}
    19% {d:path('M36 32 H204 V104 C150 142 90 142 36 104 Z');transform:scaleX(.955);}   /* deep localized pocket punch + sides pull in */
    42% {d:path('M36 32 H204 V104 C150 90 90 90 36 104 Z');transform:scaleX(1.016);}    /* spring back (overshoot) */
    62% {d:path('M36 32 H204 V104 C150 119 90 119 36 104 Z');transform:scaleX(.993);}   /* wobble down */
    80% {d:path('M36 32 H204 V104 C150 99 90 99 36 104 Z');transform:scaleX(1.004);}    /* tiny up */
    100%{d:path('M36 32 H204 V104 C150 104 90 104 36 104 Z');transform:scaleX(1);}
  }
  /* depth shadow that blooms in the pocket so the net reads as punching INWARD */
  .netpocket{opacity:0;transform-box:fill-box;transform-origin:center;}
  .after.scored .netpocket{animation:pocketshade .8s cubic-bezier(.33,.06,.28,1);}
  @keyframes pocketshade{
    0%  {opacity:0;transform:scale(.35) translateY(-6px);}
    19% {opacity:1;transform:scale(1.08) translateY(3px);}    /* deep punch -> pocket recedes into shadow */
    42% {opacity:.25;transform:scale(.7) translateY(-3px);}   /* springs back */
    62% {opacity:.5;transform:scale(.92);}
    100%{opacity:0;transform:scale(.5);}
  }
  /* the ball that flies in */
  .ball{position:absolute;left:50%;top:0;width:21%;aspect-ratio:1;margin-left:-10.5%;
    background:url('assets/ducks/wcball.png') center/contain no-repeat;
    transform:translateY(180%) scale(1.05);opacity:0;pointer-events:none;will-change:transform;}
  .shoot .ball{animation:ballfly .5s cubic-bezier(.4,.5,.6,1) forwards;}
  @keyframes ballfly{
    0%  {transform:translateY(185%) scale(1.1);opacity:1;}
    70% {transform:translateY(54%) scale(.6);opacity:1;}
    100%{transform:translateY(60%) scale(.5);opacity:1;}   /* sinks into the pocket */
  }
  .scored .ball{animation:ballrest .55s ease .5s forwards;}
  @keyframes ballrest{0%{transform:translateY(60%) scale(.5);opacity:1;}100%{transform:translateY(66%) scale(.42);opacity:0;}}   /* recedes IN */
  /* GOAL text */
  .goaltext{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%) scale(.4);font-size:30px;font-weight:900;
    color:#FFD23F;paint-order:stroke;-webkit-text-stroke:5px #6b3f12;white-space:nowrap;opacity:0;pointer-events:none;
    filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));}
  .scored .goaltext{animation:goalpop 1s cubic-bezier(.2,1.4,.4,1);}
  @keyframes goalpop{0%{opacity:0;transform:translate(-50%,-40%) scale(.3) rotate(-8deg)}28%{opacity:1;transform:translate(-50%,-78%) scale(1.12) rotate(4deg)}68%{opacity:1;transform:translate(-50%,-86%) scale(1)}100%{opacity:0;transform:translate(-50%,-104%) scale(.95)}}
  .btn{margin-top:26px;background:#3FA7E0;color:#fff;border:none;border-radius:16px;font-size:16px;font-weight:900;
    padding:14px 34px;box-shadow:0 5px 0 #2C82C9;cursor:pointer;}
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2C82C9;}
  .note{margin-top:14px;font-size:12px;opacity:.7;}
</style></head>
<body>
  <h1>Goal net — Before vs After</h1>
  <p class="sub">Same goal, same ball. "After" gives the net a localized pocket where the ball lands, then a springy damped wobble as it settles, instead of one stiff stretch.</p>
  <div class="row" id="row"></div>
  <button class="btn" id="replay">Replay</button>
  <p class="note">Loops automatically every few seconds.</p>

<script>
const GOAL = (cls,label,labelCls)=>`
  <div class="card">
    <div class="tag ${labelCls||''}">${label}</div>
    <div class="goal ${cls}">
      <svg class="goalsvg" viewBox="0 0 240 120">
        <defs>
          <pattern id="net_${cls}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <path d="M5 0V10M0 5H10" stroke="#fff" stroke-opacity=".34" stroke-width="1.1"/>
          </pattern>
          <linearGradient id="post_${cls}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d4dbe4"/></linearGradient>
          <radialGradient id="pocket_${cls}"><stop offset="0" stop-color="#0c3a1c" stop-opacity=".55"/><stop offset="62%" stop-color="#0c3a1c" stop-opacity=".22"/><stop offset="100%" stop-color="#0c3a1c" stop-opacity="0"/></radialGradient>
        </defs>
        <ellipse cx="120" cy="108" rx="103" ry="7" fill="rgba(0,0,0,.16)"/>
        <path class="gnet" d="M36 32 H204 V104 C150 104 90 104 36 104 Z" fill="url(#net_${cls})"/>
        <ellipse class="netpocket" cx="120" cy="80" rx="46" ry="34" fill="url(#pocket_${cls})"/>
        <path d="M36 32L50 18H190L204 32" fill="none" stroke="#c9d1db" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M50 18V96" stroke="#dfe5ec" stroke-width="2" opacity=".45"/><path d="M190 18V96" stroke="#dfe5ec" stroke-width="2" opacity=".45"/>
        <path d="M36 104V38a6 6 0 0 1 6-6H198a6 6 0 0 1 6 6V104" fill="none" stroke="url(#post_${cls})" stroke-width="9" stroke-linecap="round"/>
        <path d="M36 104V38a6 6 0 0 1 6-6H198a6 6 0 0 1 6 6V104" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".75"/>
      </svg>
      <div class="ball"></div>
      <div class="goaltext">GOAL!</div>
    </div>
  </div>`;
document.getElementById('row').innerHTML = GOAL('before','BEFORE') + GOAL('after','AFTER','after');
const goals=[...document.querySelectorAll('.goal')];
function play(){
  goals.forEach(g=>{ g.classList.remove('scored','shoot'); void g.offsetWidth; g.classList.add('shoot'); });
  setTimeout(()=>goals.forEach(g=>g.classList.add('scored')), 360);   // ball reaches the net -> net reacts
}
document.getElementById('replay').onclick=play;
play(); setInterval(play, 2800);
</script>
</body></html>
