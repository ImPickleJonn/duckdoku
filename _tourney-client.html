<!-- ============ DUCK CUP / WORLD CUP (client) — injected before </body> ============ -->
<style>
/* home entry button */
.btn.wcbtn{background:#3CB371;color:#fff;text-shadow:0 1px 0 #2e8b57;box-shadow:0 6px 0 #2e8b57;display:flex;align-items:center;justify-content:center;gap:10px;position:relative;width:72%;align-self:center;font-size:4.8vw;padding:15px;}
.btn.wcbtn.locked{filter:saturate(.55);opacity:.9;}
.wcbtn-flag{width:30px;height:22px;display:flex;align-items:center;justify-content:center;flex:none;}
.wcbtn-flag img{width:30px;height:21px;border-radius:4px;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.25);}
.wcbtn-flag svg{width:26px;height:26px;}
.wcbtn-lock{display:none;position:absolute;top:7px;right:12px;width:19px;height:19px;}
.btn.wcbtn.locked .wcbtn-lock{display:block;}
/* player avatar in the top-left home corner */
.iconbtn.homeav{background:#FFD23F;padding:0;overflow:visible;position:relative;}
.iconbtn.homeav #homeAvImg{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;}
.homeavflag{position:absolute;bottom:-2px;right:-3px;width:19px;height:13px;border-radius:3px;object-fit:cover;border:1.5px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.35);display:none;}   /* (#4) country flag badge on the avatar */
.homeavflag.on{display:block;}
.hb-left .homeav{margin-right:7px;}   /* avatar alone in the corner; leaderboard + daily nudge to its right */
.lbrow .lbav{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#FFD23F;flex:none;margin:0 9px 0 2px;}   /* (#6) duck avatar on the main leaderboard */
/* World Cup full screen */
#wc .wcme{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;color:var(--ink-soft);font-size:14px;padding:8px 12px 4px;cursor:default;}
#wc .wcme .wcmeav{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#FFD23F;}
#wc .wcme .wcmeflag{width:24px;height:16px;border-radius:3px;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.2);}
#wc .wcme .wcmegoals{font-size:12px;color:var(--orange);font-weight:900;background:rgba(232,148,47,.14);border-radius:9px;padding:2px 9px;}
#wc .ttabs{width:min(92vw,420px);margin:6px auto 8px;}
#wc .wclist{flex:1 1 auto;min-height:0;width:min(92vw,420px);align-self:center;overflow-y:auto;padding:2px 2px 10px;-webkit-overflow-scrolling:touch;}
#wc .wcfoot{width:100%;display:flex;justify-content:center;padding:8px 0 calc(12px + var(--safe-bot,0px));background:linear-gradient(to top,var(--bg) 55%,transparent);}
#wc .wcfoot .btn.play{width:min(86vw,420px);font-size:5.2vw;padding:18px;}
/* ===== World Cup match: green pitch + soccer goal + scoring ===== */
#app.cup #game{background:radial-gradient(135% 100% at 50% 6%, #3a9a52 0%, #2f8745 48%, #256d39 100%)!important;}
#app.cup #qboard{filter:drop-shadow(0 8px 16px rgba(0,0,0,.30));}
#app.cup .topbar .toptitle{color:#fff!important;}
#app.cup .blabel{display:none!important;}                       /* (#1) hide Place/Hint labels in the cup */
.pface{position:relative;}
.pface .pfaceball{display:none;width:100%;height:100%;object-fit:contain;position:absolute;inset:0;}
#app.cup .pface canvas{display:none;}                          /* (#2) static soccer ball instead of the duck on the progress bar */
#app.cup .pface .pfaceball{display:block;}
/* (#1,#2) reorder #game children: goal up top, rules pills below the boosters */
#app.cup .topbar{order:0;} #app.cup #wcGoal{order:1;} #app.cup .statusrow{order:2;} #app.cup .boardwrap{order:3;} #app.cup #boosters{order:4;} #app.cup #chipswrap{order:5;margin-top:8px;}
/* the soccer goal at the top */
.wcgoal{display:none;position:relative;width:min(74vw,300px);margin:0 auto;}
#app.cup #wcGoal{display:block;}
.wcgoal .goalsvg{width:100%;height:auto;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.28));}
.wcgoal .gnet{transform-origin:50% 0;transition:transform .1s;}
.wcgoal.scored .gnet{animation:netbulge .55s ease;}
@keyframes netbulge{0%{transform:scaleY(1)}28%{transform:scaleY(1.16) translateY(3px)}100%{transform:scaleY(1)}}
.goaltext{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.4);font-size:8.5vw;font-weight:900;color:#FFD23F;paint-order:stroke;-webkit-text-stroke:5px #6b3f12;white-space:nowrap;letter-spacing:.5px;opacity:0;pointer-events:none;filter:drop-shadow(0 4px 3px rgba(0,0,0,.35));}
.goaltext.go{animation:goalpop 1s cubic-bezier(.2,1.4,.4,1) forwards;}
@keyframes goalpop{0%{opacity:0;transform:translate(-50%,-40%) scale(.3) rotate(-8deg)}28%{opacity:1;transform:translate(-50%,-78%) scale(1.12) rotate(4deg)}68%{opacity:1;transform:translate(-50%,-86%) scale(1)}100%{opacity:0;transform:translate(-50%,-104%) scale(.95)}}
/* spinning ball in a found tile + the flying ball */
.wcball{width:94%;height:94%;object-fit:contain;animation:wcspin .8s linear infinite;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));}
@keyframes wcspin{to{transform:rotate(360deg)}}
.wcflyball{position:fixed;z-index:88;pointer-events:none;will-change:transform;}
.wcflyball svg{width:100%;height:100%;display:block;}
@keyframes wcfly{0%{transform:translate(0,0) scale(1) rotate(0)}34%{transform:translate(calc(var(--dx)*.45),calc(var(--dy)*.45 - 48px)) scale(.82) rotate(300deg)}100%{transform:translate(var(--dx),var(--dy)) scale(.32) rotate(700deg)}}
/* (#4) red card for a wrong guess (the tile keeps its own colour) */
.redcard{width:66%;height:66%;animation:pop .16s cubic-bezier(.34,1.56,.64,1);}
/* green Play-for-country button (#9) */
#wc .wcfoot #wcPlay{background:#36b24a;box-shadow:0 6px 0 #248235;text-shadow:0 1px 0 #248235;}
/* won World Cup sticker reveal in the result (#14) */
.cupsticker{display:flex;flex-direction:column;align-items:center;gap:4px;margin:2px auto 2px;}
.cupsticker .cstag{font-size:12px;font-weight:900;color:#FFE7A0;letter-spacing:.3px;}
.cupsticker .csimg{width:76px;height:76px;border-radius:16px;object-fit:cover;border:3px solid #FFC23C;box-shadow:0 0 16px rgba(255,194,60,.6);animation:podPop .5s cubic-bezier(.2,1.3,.45,1) backwards;animation-delay:.9s;background:#3b2f25;}
/* room board */
.tbig{width:100%;max-width:320px;}
#tResVid{width:min(64vw,240px);aspect-ratio:1;display:block;margin:0 auto -6px;border-radius:18px;background:#000;}
.troom{width:100%;max-width:340px;display:flex;flex-direction:column;gap:6px;margin:6px 0;}
.trow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:14px;background:#f2efee;border:2px solid #e7ddd8;transition:transform .25s,background .25s;}
.trow.me{background:#FFF4D6;border-color:var(--orange);}
.trow.pending{opacity:.65;}
.trank{width:26px;height:26px;border-radius:50%;background:#e3d8d2;color:#6E4F44;font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none;}
.trow:nth-child(1) .trank{background:#FFD23F;color:#5a4300;}
.trow:nth-child(2) .trank{background:#dfe7f0;color:#5a6c80;}
.trow:nth-child(3) .trank{background:#ecc59a;color:#7a4a14;}
.tav{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#FFD23F;flex:none;}
.tnm{flex:1;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;}
.tfg{width:22px;height:15px;border-radius:3px;object-fit:cover;flex:none;}
.tmiss{font-size:12px;font-weight:900;color:var(--accent-deep,#c0612e);flex:none;}
.tmiss.pend{color:var(--ink-soft);}
.tprize{font-weight:900;color:var(--orange);margin:4px 0 2px;}
/* full-screen room result + podium */
.cupresult .wincol{gap:6px;}
.cupvid{width:min(44vw,168px);aspect-ratio:1;display:block;margin:0 auto;border-radius:18px;background:#000;}
.cupresult h2{margin:2px 0 0;}
.cuppod{display:flex;align-items:flex-end;justify-content:center;gap:7px;width:100%;max-width:360px;margin:8px auto 2px;}
.cuppod .pod{display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;animation:podPop .5s cubic-bezier(.2,1.3,.45,1) backwards;}
.cuppod .pod.p3{animation-delay:.1s;} .cuppod .pod.p2{animation-delay:.35s;} .cuppod .pod.p1{animation-delay:.65s;}
@keyframes podPop{0%{transform:translateY(22px) scale(.55);opacity:0;}60%{transform:translateY(-4px) scale(1.06);}100%{transform:translateY(0) scale(1);opacity:1;}}
.pod .podavwrap{position:relative;display:inline-flex;}
.pod .podav{width:50px;height:50px;border-radius:50%;object-fit:cover;background:#3b2f25;border:3px solid #FFD23F;}
.pod.p2 .podav{width:44px;height:44px;border-color:#cfd8e6;} .pod.p3 .podav{width:42px;height:42px;border-color:#e7b07a;}
.pod.me .podav{box-shadow:0 0 0 3px #fff,0 0 14px #FFD23F;}
.pod .podname{font-size:11px;font-weight:800;color:#fff;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
.pod .podflag{position:absolute;right:-5px;bottom:-3px;width:21px;height:15px;border-radius:3px;object-fit:cover;border:1.6px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.45);}   /* flag badge on the avatar (like the lobby) */
.pod .podbar{width:100%;border-radius:11px 11px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px 7px;color:#3b2f25;}
.pod.p1 .podbar{height:90px;background:linear-gradient(#FFE48A,#FFC02E);box-shadow:0 0 16px rgba(255,200,40,.45);}
.pod.p2 .podbar{height:76px;background:linear-gradient(#eef2f7,#c4cedd);}
.pod.p3 .podbar{height:66px;background:linear-gradient(#f4d2ab,#dd9a58);}
.pod .podrank{font-size:18px;font-weight:900;line-height:1;}
.pod .podsc{font-size:10px;font-weight:900;color:rgba(59,47,37,.82);line-height:1;}   /* goals under the rank */
.pod .podrew{display:flex;align-items:center;gap:3px;font-size:13px;font-weight:900;margin-top:3px;white-space:nowrap;}
.pod .podrew svg{width:21px;height:21px;flex:none;}        /* (#3) bigger prize icons */
.pod .podstar{width:19px;height:19px;display:inline-flex;flex:none;}
.cupyou{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);color:#fff;border-radius:13px;padding:7px 11px;width:100%;max-width:320px;margin:5px auto 0;}
.cupyou.me{background:#FFF4D6;color:#3b2f25;}
.cupyou .trank{width:24px;height:24px;background:#5a4a40;color:#fff;font-size:12px;}
.cupyou.me .trank{background:var(--orange);}
.cupyou .cyav{position:relative;flex:none;display:inline-flex;}
.cupyou .cyav .tfg{position:absolute;right:-4px;bottom:-3px;width:18px;height:12px;border-radius:3px;border:1.4px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.4);margin:0;}
.cupyou .tnm{color:inherit;}
.cupyou .tmiss{color:inherit;font-weight:900;}
.cupresult .tprize{color:#FFE7A0;font-size:14px;max-width:320px;}
/* flag picker */
.flaggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-height:56vh;overflow-y:auto;overflow-x:hidden;padding:4px;box-sizing:border-box;}
.flagcell{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:14px;background:var(--card);box-shadow:0 3px 0 var(--shadow);cursor:pointer;min-width:0;}
.flagcell img{width:46px;height:31px;border-radius:4px;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.flagcell span{font-size:11px;font-weight:800;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.flagcell.sel{outline:3px solid var(--orange);box-shadow:0 3px 0 var(--shadow),0 0 0 3px rgba(232,148,47,.25);}
.btn.flagselbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:12px;background:#36b24a;box-shadow:0 6px 0 #248235;text-shadow:0 1px 0 #248235;color:#fff;}
.btn.flagselbtn:disabled{filter:saturate(.5);opacity:.65;}
.btn.flagselbtn .fsflag{width:32px;height:22px;border-radius:4px;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.3);background:#fff;}
/* history + leaderboard rows */
.thist{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:14px;background:#f2efee;margin-bottom:6px;cursor:pointer;}
.thist .trank{width:30px;height:30px;}
.thist b{font-weight:900;color:var(--ink);}
.thsub{font-size:12px;color:var(--ink-soft);}
.ttabs{display:flex;gap:8px;margin:2px 0 8px;}
.ttab{flex:1;padding:8px;border-radius:12px;background:var(--card);box-shadow:0 3px 0 var(--shadow);font-weight:800;color:var(--ink-soft);cursor:pointer;text-align:center;}
.ttab.on{background:var(--orange);color:#fff;box-shadow:0 3px 0 var(--orange-d);}
.lcrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:13px;background:#f2efee;margin-bottom:5px;}
.lcrow.me{background:#FFF4D6;}
.lcrow .trank{width:24px;height:24px;}
.lcrow img{width:26px;height:18px;border-radius:3px;object-fit:cover;}
.lcrow .tnm{font-size:14px;}
.lcgoals{font-weight:900;color:var(--orange);}
.lcrow .lcav{width:27px;height:27px;border-radius:50%;object-fit:cover;background:#FFD23F;flex:none;}
.lchead{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:13px;background:#FFF4D6;margin-bottom:7px;font-weight:900;color:var(--ink);}
.lchead img{width:30px;height:20px;border-radius:3px;object-fit:cover;box-shadow:0 1px 2px rgba(0,0,0,.2);}
.lcsep{text-align:center;color:var(--ink-soft);font-weight:900;letter-spacing:3px;margin:1px 0 3px;}
/* name modal */
.navatars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;justify-items:center;margin:8px 0 14px;max-height:48vh;overflow-y:auto;padding:6px 6px 16px;}
.navatar{width:60px;height:60px;border-radius:50%;background:#FFF4D6;padding:3px;cursor:pointer;border:3px solid transparent;box-shadow:0 3px 0 var(--shadow);}
.navatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.navatar.sel{border-color:var(--orange);box-shadow:0 3px 0 var(--orange-d);}
.namerow{display:flex;gap:8px;align-items:center;margin-bottom:4px;}
.namerow input{flex:1;padding:13px 14px;border-radius:14px;border:2px solid var(--shadow);font-size:16px;font-weight:800;color:var(--ink);background:var(--card);outline:none;}
.namerow input:read-only{opacity:.7;color:var(--ink-soft);cursor:default;}
.namedice{width:50px;height:50px;border-radius:14px;background:var(--blue);box-shadow:0 3px 0 var(--blue-d);display:flex;align-items:center;justify-content:center;flex:none;}
.namedice svg{width:24px;height:24px;}
/* World Cup rules popup */
.cirows{display:flex;flex-direction:column;gap:13px;margin:8px 0 14px;text-align:left;}
.cirow{display:flex;align-items:center;gap:13px;}
.cirow .ciic{width:58px;flex:none;display:flex;align-items:center;justify-content:center;}
.cirow .citx{display:flex;flex-direction:column;gap:2px;min-width:0;}
.cirow .citx b{font-weight:900;color:var(--ink);font-size:14px;}
.cirow .citx span{font-size:12.5px;color:var(--ink-soft);line-height:1.32;}
.cigrp{display:flex;}.cigrp svg{width:21px;height:21px;margin-left:-7px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15));}.cigrp svg:first-child{margin-left:0;}
.cicards{display:flex;gap:4px;}.cicards svg{width:18px;height:24px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.2));}
.ciball-wrap{position:relative;width:48px;height:40px;}.ciball-wrap .ciball{width:40px;height:40px;object-fit:contain;}
.ciball-wrap .ciflag{position:absolute;right:-2px;bottom:0;width:20px;height:14px;border-radius:3px;object-fit:cover;border:1.4px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,.3);}
.citrophy svg{width:42px;height:42px;}
</style>

<!-- Flag picker -->
<div class="scrim" id="scrimFlag"><div class="modal modal-rel">
  <button class="closex" id="flagClose"><svg viewBox="0 0 24 24" fill="none" stroke="#6E4F44" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h2 id="flagTitle">Pick your country</h2>
  <p style="color:var(--ink-soft)" id="flagSub">You will play for your country in the World Cup.</p>
  <div class="flaggrid" id="flagGrid"></div>
  <button class="btn flagselbtn" id="flagSelect"><span id="flagSelTxt">Select</span><img class="fsflag" id="flagSelImg" alt=""></button>
</div></div>

<!-- Leave-run confirm (back button during a World Cup run) -->
<div class="scrim" id="scrimCupQuit"><div class="modal modal-rel">
  <h2 id="cqTitle">Are you sure?</h2>
  <p style="color:var(--ink-soft)" id="cqSub">You will lose your goals!</p>
  <button class="btn play" id="cqStay">Keep playing</button>
  <button class="btn" id="cqLeave" style="background:var(--heart);box-shadow:0 5px 0 #c0392b;color:#fff;margin-top:8px">Leave</button>
</div></div>

<!-- Room result (full screen, podium) -->
<div class="scrim winscrim cupresult" id="scrimCupRes"><div class="wincol">
  <video id="tResVid" class="cupvid" autoplay loop muted playsinline preload="auto" disablepictureinpicture x-webkit-airplay="deny"></video>
  <h2 id="tResTitle">Room finished</h2>
  <div class="cuppod" id="cupPod"></div>
  <div id="cupExtra"></div>
  <div class="cupsticker" id="cupSticker" style="display:none"></div>
  <div class="tprize" id="tPrize"></div>
  <button class="btn" id="tResClose" style="background:var(--blue);box-shadow:0 5px 0 var(--blue-d);color:#fff;width:100%">Let's go!</button>
</div></div>

<!-- History -->
<div class="scrim" id="scrimCupHist"><div class="modal modal-rel">
  <button class="closex" id="thistClose"><svg viewBox="0 0 24 24" fill="none" stroke="#6E4F44" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h2 id="thistTitle">Matches History</h2>
  <p style="color:var(--ink-soft)" id="thistSub">Play matches to see results here.</p>
  <div id="thistList"><p style="color:var(--ink-soft)">Loading...</p></div>
</div></div>

<!-- World Cup rules -->
<div class="scrim" id="scrimCupInfo"><div class="modal modal-rel">
  <button class="closex" id="infoClose"><svg viewBox="0 0 24 24" fill="none" stroke="#6E4F44" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <h2 id="ciTitle">How the World Cup works</h2>
  <div class="cirows" id="ciRows"></div>
  <button class="btn play" id="ciGo">Got it</button>
</div></div>

<!-- Choose your duck (name + avatar) -->
<div class="scrim" id="scrimName"><div class="modal modal-rel">
  <h2 id="nameTitle">Choose your duck</h2>
  <p style="color:var(--ink-soft)" id="nameSub">This is how you show up in the World Cup.</p>
  <div class="navatars" id="nameAvatars"></div>
  <div class="namerow">
    <input id="nameInput" maxlength="16" placeholder="Your name" autocomplete="off">
    <button class="namedice" id="nameDice" aria-label="random"><svg viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="16" height="16" rx="4" fill="#fff"/><circle cx="9" cy="9" r="1.5" fill="#3a6ea5"/><circle cx="15" cy="9" r="1.5" fill="#3a6ea5"/><circle cx="12" cy="12" r="1.5" fill="#3a6ea5"/><circle cx="9" cy="15" r="1.5" fill="#3a6ea5"/><circle cx="15" cy="15" r="1.5" fill="#3a6ea5"/></svg></button>
  </div>
  <button class="btn play" id="nameSave">Save</button>
</div></div>

<script>
/* ============ DUCK CUP / WORLD CUP ============ */
const TOURNEY_UNLOCK_LEVEL = 1;                 // World Cup is open from the very start
const TOURNEY_N = 6;                            // fixed 6x6 grid: fair, medium, quick
let TOURNEY = { active:false, seed:0, start:0 };
const CUP_FLAG  = cc => 'https://flagcdn.com/w40/' + String(cc||'').toLowerCase() + '.png';
const CUP_FLAGW = cc => 'https://flagcdn.com/w80/' + String(cc||'').toLowerCase() + '.png';
const TWC_COUNTRIES = [
  ['BR','Brazil'],['AR','Argentina'],['FR','France'],['DE','Germany'],['ES','Spain'],['GB','England'],
  ['PT','Portugal'],['NL','Netherlands'],['IT','Italy'],['BE','Belgium'],['HR','Croatia'],['US','USA'],
  ['MX','Mexico'],['JP','Japan'],['KR','Korea'],['AU','Australia'],['CA','Canada'],['MA','Morocco'],
  ['SN','Senegal'],['NG','Nigeria'],['EG','Egypt'],['SA','Saudi'],['TR','Turkey'],['RU','Russia'],
  ['UA','Ukraine'],['PL','Poland'],['CO','Colombia'],['UY','Uruguay'],['CH','Swiss'],['DK','Denmark'],
  ['SE','Sweden'],['IN','India'],['ID','Indonesia'],['CL','Chile'],['NO','Norway'],['FI','Finland'],
  ['IE','Ireland'],['GR','Greece'],['AT','Austria'],['CZ','Czechia'],['RS','Serbia'],['RO','Romania'],
  ['HU','Hungary'],['SK','Slovakia'],['SI','Slovenia'],['BG','Bulgaria'],['BA','Bosnia'],['AL','Albania'],
  ['PE','Peru'],['EC','Ecuador'],['VE','Venezuela'],['PY','Paraguay'],['BO','Bolivia'],['CR','Costa Rica'],

  let wonSticker = (myRank===1) ? grantCupSticker() : null;
  const cs=$('cupSticker');
  if(cs){ if(wonSticker){ cs.style.display=''; cs.innerHTML='<div class="cstag">'+L('NEW World Cup sticker!','НОВАЯ наклейка Кубка!')+'</div><img class="csimg" src="assets/stickers/'+wonSticker.id+'.png?v='+DD_VERSION+'"><div class="cstag" style="color:#fff">'+stName(wonSticker)+'</div>'; } else { cs.style.display='none'; cs.innerHTML=''; } }
  const myScore=((board.find(x=>x.me)||{}).score)||0;
  let pl = prize.gold ? (L('You won ','Ты выиграл ')+prize.gold+' '+L('gold','золота')) : L('No prize this match. Top 3 win gold; #1 wins a sticker.','Без приза. Топ 3 берут золото; 1 место получает наклейку.');
  if(myScore){ pl += '    +'+myScore+' '+L('goals for ','голов для ')+(CC_NAME[myCountry()]||myCountry()); }   // your ducks found feed your country's total
  $('tPrize').textContent = pl;
  // (#8) save this room to LOCAL history so every player can review past rooms (not only Telegram)
  try{ save.cupHistory=(save.cupHistory||[]); save.cupHistory.unshift({seed:(typeof TOURNEY!=='undefined'&&TOURNEY.seed)||0,score:myScore,rank:myRank,goals:(res&&res.goals)||0,board:board,ts:Date.now()}); save.cupHistory=save.cupHistory.slice(0,30); persist(); }catch(e){}
  try{ window._myCupGoals=(typeof window._myCupGoals==='number'?window._myCupGoals:0)+myScore; }catch(e){}   // reflect this run in my goals total right away
  if(won){ haptic('win'); confettiRain(); } else { try{haptic('light');}catch(e){} }
  _tRevealT.push(setTimeout(()=>{ try{haptic('light');}catch(e){} }, 350));
  _tRevealT.push(setTimeout(()=>{ try{haptic(won?'win':'light');}catch(e){} }, 750));
  _cupResMode='run'; const rc=$('tResClose'); if(rc){ rc.textContent=L("Let's go!","Поехали!"); rc.style.display=''; }
}
function localRoom(score,timeMs){ // offline fallback (no server): fabricate 4 ghosts, ranked by GOALS (ducks found)
  const ghosts=[]; for(let i=0;i<4;i++){ const sc=Math.floor(8+Math.random()*36); ghosts.push({name:['Pip','Coco','Dax','Olive'][i],country:['BR','FR','JP','US'][i],avatar:null,score:sc,time_ms:Math.floor(40000+Math.random()*70000)}); }
  const me={name:myName(),country:myCountry(),avatar:myAvatar(),score,time_ms:timeMs};
  const all=[Object.assign({me:true},me),...ghosts.map(g=>Object.assign({me:false},g))];
  all.sort((a,b)=>(b.score-a.score)||(a.time_ms-b.time_ms));
  const rank=all.findIndex(x=>x.me)+1;
  return { ok:true, myRank:rank, goals:rank===1?3:rank===2?2:rank===3?1:0, prize:rank===1?{gold:100,sticker:true}:rank===2?{gold:50}:rank===3?{gold:25}:{},
    board: all.map((x,i)=>({rank:i+1,name:x.name,country:x.country,avatar:x.avatar,score:x.score,timeMs:x.time_ms,me:!!x.me})) };
}

/* ---- history ---- */
function _histRow(r){
  const medal=r.rank===1?'#FFD23F':r.rank===2?'#dfe7f0':r.rank===3?'#ecc59a':'#e3d8d2';
  return '<div class="thist" onclick=\'showHistRoom('+JSON.stringify(JSON.stringify(r.board||[]))+')\'><div class="trank" style="background:'+medal+'">'+(r.rank||'-')+'</div><div style="flex:1"><b>'+L('Rank ','Место ')+(r.rank||'-')+' / 5</b><div class="thsub">'+((r.score!=null?r.score:0))+' '+L('goals','голов')+(r.goals?(' . +'+r.goals+' '+L('for country','для страны')):'')+'</div></div></div>';
}
function _renderHist(runs){
  const sub=$('thistSub');
  if(!runs.length){ if(sub) sub.style.display=''; $('thistList').innerHTML=''; return; }   // empty -> show the subtitle hint only
  if(sub) sub.style.display='none';
  $('thistList').innerHTML = runs.map(_histRow).join('');
}
// (#8) history works for EVERYONE: local save.cupHistory, merged with the server's cross-device history for Telegram users.
function openCupHist(){
  closeAll(); openScrim('scrimCupHist');
  $('thistTitle').textContent=L('Matches History','История матчей');
  $('thistSub').textContent=L('Play matches to see results here.','Сыграй матчи, чтобы увидеть результаты.');
  const local=(save.cupHistory||[]).slice();
  _renderHist(local);
  _tapi('/api/tourney/history',{initData,guestId:wcGuestId()}).then(j=>{   // works for native (guest) too
    if(!j) return;
    const sv=((j.runs)||[]).map(r=>({seed:r.seed,score:r.score,rank:r.rank,goals:r.goals,board:r.board,ts:(+new Date(r.ts))||0}));
    const seen=new Set();
    const all=local.concat(sv).filter(r=>{const k=(r.ts||0)+'_'+(r.rank||0)+'_'+((r.score!=null)?r.score:0);if(seen.has(k))return false;seen.add(k);return true;}).sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,30);
    _renderHist(all);
  });
}
function showHistRoom(boardStr){ let board=[]; try{board=JSON.parse(boardStr);}catch(e){} closeAll(); board=board.slice().sort((a,b)=>(a.rank||0)-(b.rank||0)); _cupResMode='hist'; $('tResTitle').textContent=L('Match result','Итог матча'); $('tPrize').textContent=''; const cs=$('cupSticker'); if(cs){cs.style.display='none';cs.innerHTML='';} try{$('tResVid').removeAttribute('src');}catch(e){} renderPodium(board); renderCupExtra(board,(board.findIndex(x=>x.me)+1)||0); const rc=$('tResClose'); if(rc){ rc.textContent=L('Back','Назад'); rc.style.display=''; } openScrim('scrimCupRes'); }

/* ---- World Cup rules popup (the "i" button) ---- */

  $('ciTitle').textContent=L('How the World Cup works','Как устроен Кубок мира');

  const CARD='<svg viewBox="0 0 16 22"><rect x="2" y="1.5" width="12" height="19" rx="2.4" fill="#E0322B" stroke="#9e1b15" stroke-width="1.4" transform="rotate(12 8 11)"/></svg>';
  const BALL='<img class="ciball" src="'+WC_BALL_SRC+'" alt="">';
  const TROPHY='<svg viewBox="0 0 24 24"><path d="M7 3h10v3.5a5 5 0 0 1-10 0V3z" fill="#FFD23F" stroke="#E0A21E" stroke-width="1.2"/><path d="M7 4H4v1.4a3 3 0 0 0 3 3M17 4h3v1.4a3 3 0 0 1-3 3" fill="none" stroke="#E0A21E" stroke-width="1.4"/><rect x="10" y="11" width="4" height="3.2" fill="#E0A21E"/><rect x="7.5" y="14" width="9" height="3.2" rx="1.3" fill="#C98A1A"/></svg>';
  const rows=[
    {ic:'<div class="cigrp">'+DUCK+DUCK+DUCK+DUCK+DUCK+'</div>', t:L('Survival match','Матч на выживание'), d:L('You are up against 5 players. Survive as long as you can.','Ты играешь против 5 игроков. Продержись как можно дольше.')},
    {ic:'<div class="cicards">'+CARD+CARD+CARD+'</div>', t:L('Three red cards and you are out','Три карточки и ты выбываешь'), d:L('Every wrong tap is a red card. Three red cards ends your run.','Каждый промах это красная карточка. Три карточки и забег окончен.')},
    {ic:'<div class="ciball-wrap">'+BALL+flag+'</div>', t:L('Goals for your country','Голы для твоей страны'), d:L('Every duck you find scores a goal that feeds your country in the standings.','Каждая найденная утка это гол в зачёт твоей страны.')},
    {ic:'<div class="citrophy">'+TROPHY+'</div>', t:L('Win gold and a sticker','Выиграй золото и наклейку'), d:L('Finish top 3 for gold. Number 1 wins a new World Cup sticker.','Топ 3 получают золото. Первое место получает новую наклейку Кубка.')}
  ];
  $('ciRows').innerHTML = rows.map(r=>'<div class="cirow"><div class="ciic">'+r.ic+'</div><div class="citx"><b>'+r.t+'</b><span>'+r.d+'</span></div></div>').join('');
  openScrim('scrimCupInfo');
}

/* ---- World Cup leaderboards (inside the #wc screen) ---- */
let _twcTab='cc';
function setTwcTab(tab){ _twcTab=tab; const a=$('twcTabCC'),b=$('twcTabMine'); if(a){a.textContent=L('Countries','Страны');a.classList.toggle('on',tab==='cc');} if(b){b.textContent=L('My country','Моя страна');b.classList.toggle('on',tab==='mine');} renderTwc(); }
function renderTwc(){
  const el=$('twcList'); if(!el) return; el.innerHTML='<p style="color:var(--ink-soft)">'+L('Loading...','Загрузка...')+'</p>';
  const myCC=myCountry();
  if(_twcTab==='cc'){
    _tapi('/api/tourney/countries').then(j=>{ const cs=(j&&j.countries)||[];
      if(!cs.length){ el.innerHTML='<p style="color:var(--ink-soft)">'+L('No goals yet. Be the first!','Голов пока нет. Будь первым!')+'</p>'; return; }
      el.innerHTML=cs.map((c,i)=>'<div class="lcrow'+(c.country===myCC?' me':'')+'"><div class="trank">'+(i+1)+'</div><img src="'+CUP_FLAG(c.country)+'"><div class="tnm">'+(CC_NAME[c.country]||c.country)+'</div><span class="lcgoals">'+c.goals+' '+L('goals','голов')+'</span></div>').join('');
    });
  } else {
    const cc=myCC; if(!cc){ el.innerHTML='<p style="color:var(--ink-soft)">'+L('Pick a country first.','Сначала выбери страну.')+'</p>'; return; }
    _tapi('/api/tourney/country',{cc,initData,guestId:wcGuestId()}).then(j=>{
      if(!j){ el.innerHTML='<p style="color:var(--ink-soft)">'+L('Could not load.','Не удалось загрузить.')+'</p>'; return; }
      const ps=(j.players)||[], meInfo=j.me;
      if(meInfo && typeof meInfo.goals==='number'){ window._myCupGoals=meInfo.goals; const gEl=$('wcMeGoals'); if(gEl) gEl.textContent=meInfo.goals+L(' goals',' голов'); }   // keep the self-bar goals in sync
      if(!ps.length){ el.innerHTML='<p style="color:var(--ink-soft)">'+L('No players from your country yet.','Из твоей страны пока никого.')+'</p>'; return; }
      const row=(p,me)=>'<div class="lcrow'+(me?' me':'')+'"><div class="trank">'+(p.rank||0)+'</div><img class="lcav" src="'+rowAv({name:p.name})+'" onerror="this.style.visibility=\'hidden\'"><div class="tnm">'+(me?L('You','Ты'):escapeHtml(p.name||'Duck'))+'</div><span class="lcgoals">'+p.goals+' '+L('goals','голов')+'</span></div>';
      let html='<div class="lchead"><img src="'+CUP_FLAG(cc)+'"><div class="tnm">'+(CC_NAME[cc]||cc)+'</div></div>';
      html+=ps.slice(0,10).map(p=>row(p,!!p.me)).join('');   // top 10 (board holds up to 50); the server flags MY row reliably
      if(meInfo && meInfo.found && meInfo.rank>10){           // + my placement if I'm outside the top 10
        html+='<div class="lcsep">. . .</div><div class="lcrow me"><div class="trank">'+meInfo.rank+'</div><img class="lcav" src="'+rowAv({name:myName()})+'" onerror="this.style.visibility=\'hidden\'"><div class="tnm">'+L('You','Ты')+'</div><span class="lcgoals">'+meInfo.goals+' '+L('goals','голов')+'</span></div>';
      } else if(!meInfo || !meInfo.found){                    // I have not scored for this country yet
        html+='<div class="lcsep">. . .</div><div class="lcrow me"><div class="trank">-</div><img class="lcav" src="'+rowAv({name:myName()})+'" onerror="this.style.visibility=\'hidden\'"><div class="tnm">'+L('You','Ты')+'</div><span class="lcgoals">'+L('play to rank','сыграй для места')+'</span></div>';
      }
      el.innerHTML=html;
    });
  }
}

/* ---- choose your duck (name + avatar) ---- */
let _nameSel='avatar-1';
function randDuckName(){ return DUCK_NAMES[Math.floor(Math.random()*DUCK_NAMES.length)]; }
function randDuckStyle(){ return DUCK_STYLES[Math.floor(Math.random()*DUCK_STYLES.length)]; }
function renderNameAvatars(){
  const wrap=$('nameAvatars'); if(!wrap) return;
  wrap.innerHTML = DUCK_STYLES.map(s=>'<div class="navatar'+(s===_nameSel?' sel':'')+'" data-s="'+s+'"><img src="'+DUCK_AV(s)+'" alt=""></div>').join('');
  wrap.querySelectorAll('.navatar').forEach(el=>el.onclick=()=>{ _nameSel=el.dataset.s; renderNameAvatars(); try{haptic('light');}catch(e){} });
}
function openNameModal(){
  closeAll();
  const locked=!!save.name;                                   // (#1) once a name is set it cannot be changed
  $('nameTitle').textContent=L('Choose your duck','Выбери свою утку');
  $('nameSub').textContent = locked ? L('Your duck name is locked.','Имя утки закреплено.') : '';   // (#2) no generic subtitle
  $('nameInput').placeholder=L('Your name','Твоё имя');
  $('nameSave').textContent=L('Save','Сохранить');
  $('nameInput').value = save.name || randDuckName();
  $('nameInput').readOnly = locked;
  const dice=$('nameDice'); if(dice) dice.style.display = locked ? 'none' : '';
  _nameSel = (save.avatar && DUCK_STYLES.indexOf(save.avatar)>=0) ? save.avatar : randDuckStyle();
  renderNameAvatars();
  openScrim('scrimName');
}
function nameReroll(){ $('nameInput').value=randDuckName(); _nameSel=randDuckStyle(); renderNameAvatars(); try{haptic('light');}catch(e){} }
async function saveDuckName(){
  if(save.name){                                              // (#1) name locked: only the avatar may change
    save.avatar=_nameSel; persist(); try{updCupBtn();}catch(e){} try{updWcScreen();}catch(e){}
    closeScrim('scrimName'); try{haptic('ok');}catch(e){} return;
  }
  let n=(($('nameInput').value||'').trim()).slice(0,16) || randDuckName();
  for(let t=0;t<4;t++){ const res=await _tapi('/api/tourney/claim-name',{initData,guestId:wcGuestId(),name:n}); if(!res||res.ok)break; if(res.taken){ n=(n.slice(0,12)+Math.floor(10+Math.random()*89)); } else break; }   // (#1) unique name (TG or native)
  save.name=n; save.avatar=_nameSel; save.nameAsked=true; persist();
  try{updCupBtn();}catch(e){} try{updWcScreen();}catch(e){}
  closeScrim('scrimName'); try{haptic('ok');}catch(e){}
}
// after winning level 3: Telegram users keep their TG name+photo silently; everyone else picks a duck.
function maybeNameModal(){
  if(save.nameAsked) return;
  if((save.levelsDone||0) < 3) return;
  let u=null; try{ u=TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user; }catch(e){}
  if(u && (u.first_name||u.username)){
    if(!save.name) save.name=String(u.first_name||u.username).slice(0,16);
    if(!save.avatar) save.avatar = u.photo_url || randDuckStyle();
    save.nameAsked=true; persist(); try{updCupBtn();}catch(e){} return;
  }
  openNameModal();
}

/* ---- wiring ---- */
function wireCup(){
  const w=(id,fn)=>{ const e=$(id); if(e) e.onclick=fn; };
  w('btnWC', openWC);
  w('btnHomeAvatar', openNameModal);
  w('wcBack', ()=>{ show('home'); refreshHome(); });
  w('wcHistBtn', openCupHist);
  w('wcInfoBtn', openCupInfo);
  w('infoClose', ()=>closeScrim('scrimCupInfo'));
  w('ciGo', ()=>closeScrim('scrimCupInfo'));
  w('wcPlay', startTourney);
  w('twcTabCC', ()=>setTwcTab('cc'));
  w('twcTabMine', ()=>setTwcTab('mine'));
  w('flagClose', ()=>closeScrim('scrimFlag'));
  w('flagSelect', ()=>{ if(_flagSel) pickFlag(_flagSel); });
  w('cqStay', ()=>closeScrim('scrimCupQuit'));
  w('cqLeave', wcAbortRun);
  w('thistClose', ()=>closeScrim('scrimCupHist'));
  w('nameSave', saveDuckName);
  w('nameDice', nameReroll);
  w('tResClose', ()=>{ closeScrim('scrimCupRes'); try{$('tResVid').pause&&$('tResVid').pause();}catch(e){} if(_cupResMode==='hist'){ openCupHist(); return; } show('wc'); updWcScreen(); setTwcTab('cc'); refreshMyGoals(); if(typeof updCupBtn==='function')updCupBtn(); });
  updCupBtn();
}
try{ wireCup(); }catch(e){ try{ document.addEventListener('DOMContentLoaded',wireCup); }catch(_){} }
</script>
